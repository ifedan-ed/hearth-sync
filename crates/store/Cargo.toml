[package]
name = "hearth-sync-store"
description = "The engine's state database (SQLite)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The core's Store interface and row types.
hearth-sync-core = { path = "../core" }
# SQLite, compiled in ("bundled"): one pinned SQLite on every platform,
# never the system's (docs/sync.md 3.2).
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
# The conformance suite and the fakes live behind the core's `testkit`.
hearth-sync-core = { path = "../core", features = ["testkit"] }

[lints]
workspace = true
